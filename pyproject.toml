[project]
name = "ghostfolio-companion-bot"
version = "0.1.0"
description = "Manage your Ghostfolio instance from Telegram — import broker CSVs, track your portfolio, and automate backups."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "ghostfolio-bot contributors" }]
keywords = ["ghostfolio", "telegram", "portfolio", "investing", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "python-telegram-bot>=21.0,<22.0",
    "httpx>=0.27.0,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "apscheduler>=3.10,<4.0",
    "yfinance>=0.2,<1.3.0",
    "pandas>=1.3.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
]

[project.scripts]
ghostfolio-bot = "bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
